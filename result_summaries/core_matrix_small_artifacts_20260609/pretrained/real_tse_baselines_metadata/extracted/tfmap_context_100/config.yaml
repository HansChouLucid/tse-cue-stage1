clip_grad: 5.0
config: confs/tse_bsrnn_spk.yaml
data_type: shard
dataloader_args:
  batch_size: 12
  drop_last: true
  num_workers: 6
  pin_memory: true
  prefetch_factor: 6
dataset_args:
  SSA_enroll_prob: 0
  chunk_len: 48000
  fbank_args:
    dither: 1.0
    frame_length: 25
    frame_shift: 10
    num_mel_bins: 80
  noise_enroll_prob: 0
  noise_lmdb_file: ./data/musan/lmdb
  noise_prob: 0
  resample_rate: 16000
  reverb_enroll_prob: 0
  sample_num_per_epoch: 0
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
  speaker_feat: false
  specaug_enroll_prob: 0
enable_amp: false
exp_dir: exp/tse_bsrnn_spk/tfmap_context/
gpus:
- 0
- 1
log_batch_interval: 100
loss: SISDR
loss_args: {}
model:
  tse_model: TSE_BSRNN_SPK
model_args:
  tse_model:
    joint_training: true
    multi_task: false
    separator:
      causal: false
      feature_dim: 128
      nspk: 1
      num_repeat: 6
      sr: 16000
      stride: 128
      win: 512
    speaker:
      features:
        context:
          embed_dim: 512
          enabled: true
          fusion: multiply
        listen:
          enabled: false
        spkemb:
          enabled: false
        tfmap:
          enabled: true
        usef:
          enabled: false
      speaker_model:
        fbank:
          dither: 1.0
          frame_length: 25
          frame_shift: 10
          num_mel_bins: 80
          sample_rate: 16000
        speaker_encoder:
          model: ECAPA_TDNN_GLOB_c512
          pretrained: ./wespeaker_models/voxceleb_ECAPA512/avg_model.pt
          spk_args:
            embed_dim: 192
            feat_dim: 80
            pooling_func: ASTP
model_init:
  discriminator: null
  spk_model: null
  tse_model: null
num_avg: 10
num_epochs: 150
optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.001
    weight_decay: 0.0001
save_epoch_interval: 10
scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  scale_ratio: 1.0
  tse_model:
    epoch_iter: 579
    final_lr: 2.5e-05
    initial_lr: 0.001
    num_epochs: 150
    warm_from_zero: false
    warm_up_epoch: 0
seed: 42
train_data: data/clean/train-100/shard.list
train_spk2utt: data/clean/train-100/spk2enroll.json
train_utt2spk: data/clean/train-100/single.utt2spk
val_data: data/clean/dev/shard.list
val_spk1_enroll: data/clean/dev/spk1.enroll
val_spk2_enroll: data/clean/dev/spk2.enroll
val_spk2utt: data/clean/dev/single.wav.scp
