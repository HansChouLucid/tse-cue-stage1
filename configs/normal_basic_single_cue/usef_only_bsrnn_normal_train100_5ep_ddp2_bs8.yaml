clip_grad: 5.0
config: /data/tse_cue_project/experiments/configs/normal_basic_single_cue/usef_only_bsrnn_normal_train100_5ep_ddp2_bs8.yaml
data_type: raw
dataloader_args:
  batch_size: 8
  drop_last: false
  num_workers: 2
  pin_memory: true
dataset_args:
  chunk_len: 32000
  cue_processing:
    audio:
      noise_enroll_prob: 0
      reverb_enroll_prob: 0
  cues:
    audio:
      required: true
      use: true
  noise_lmdb_file: ./data/musan/lmdb
  noise_prob: 0
  resample_rate: 16000
  sample_num_per_epoch: 27800
  shuffle: true
  shuffle_args:
    shuffle_size: 2500
enable_amp: true
exp_dir: /data/tse_cue_project/experiments/normal_basic_single_cue/usef_only_bsrnn_normal_train100_5ep_ddp2_bs8
gpus:
- 0
- 1
log_batch_interval: 100
loss: SISDR
loss_args: {}
model:
  tse_model: TSE_BSRNN_SPK
model_args:
  tse_model:
    separator:
      causal: false
      feature_dim: 128
      nspk: 1
      num_repeat: 6
      sr: 16000
      stride: 128
      win: 512
    speaker:
      features:
        context:
          atten_dim: 128
          embed_dim: 512
          enabled: false
          fusion: multiply
          num_heads: 2
          speaker_model: null
        listen:
          enabled: false
          glue: 512
        spkemb:
          enabled: false
          fusion: multiply
          speaker_model: null
        tfmap:
          enabled: false
          type: spec
        usef:
          approx_qk_dim: 512
          enabled: true
          n_head: 4
          spec_dim: 2
          t_ksize: 3
      speaker_model:
        fbank:
          dither: 1.0
          frame_length: 25
          frame_shift: 10
          num_mel_bins: 80
          sample_rate: 16000
        speaker_encoder:
          model: ECAPA_TDNN_GLOB_c512
          pretrained: ./wespeaker_models/voxceleb_ECAPA512/avg_model.pt
          spk_args:
            embed_dim: 192
            feat_dim: 80
            pooling_func: ASTP
model_init:
  discriminator: null
  spk_model: null
  tse_model: null
num_avg: 10
num_epochs: 5
optimizer:
  tse_model: Adam
optimizer_args:
  tse_model:
    lr: 0.0005
    weight_decay: 0.0001
repeat_dataset: true
save_epoch_interval: 1
scheduler:
  tse_model: ExponentialDecrease
scheduler_args:
  scale_ratio: 1.0
  tse_model:
    epoch_iter: 1737
    final_lr: 2.5e-05
    initial_lr: 0.0005
    num_epochs: 5
    warm_from_zero: false
    warm_up_epoch: 0
seed: 42
train_cues: /data/tse_cue_project/manifests/librimix_normal_basic/clean/train-100/cues.yaml
train_data: /data/tse_cue_project/manifests/librimix_normal_basic/clean/train-100/raw.list
train_samples: /data/tse_cue_project/manifests/librimix_normal_basic/clean/train-100/samples.jsonl
val_cues: /data/tse_cue_project/manifests/librimix_normal_basic/clean/dev/cues.yaml
val_data: /data/tse_cue_project/manifests/librimix_normal_basic/clean/dev/raw.list
val_samples: /data/tse_cue_project/manifests/librimix_normal_basic/clean/dev/samples.jsonl
